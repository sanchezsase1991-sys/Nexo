<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔊 Nexo TTS Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; font-size: 2em; }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
        }
        textarea { min-height: 100px; resize: vertical; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.02); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .player { margin-top: 20px; }
        audio { width: 100%; }
        .history { margin-top: 30px; }
        .history-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .history-item:hover { background: rgba(255,255,255,0.1); }
        .history-item .text { color: #fff; margin-bottom: 5px; }
        .history-item .meta { color: #888; font-size: 12px; }
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        .status.success { background: rgba(0,255,0,0.2); display: block; }
        .status.error { background: rgba(255,0,0,0.2); display: block; }
        .info {
            background: rgba(100, 126, 234, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 Nexo TTS Player</h1>
        
        <div class="info">
            <strong>Instructions:</strong> Type text, select language, and click "Hablar". 
            The audio will play automatically. You can also click on history items to replay them.
        </div>
        
        <div class="card">
            <div class="input-group">
                <label>Texto a convertir:</label>
                <textarea id="text" placeholder="Escribe algo para que Nexo lo diga..."></textarea>
            </div>
            <div class="input-group">
                <label>Idioma:</label>
                <select id="lang">
                    <option value="es">🇪🇸 Spanish</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="fr">🇫🇷 French</option>
                    <option value="de">🇩🇪 German</option>
                    <option value="it">🇮🇹 Italian</option>
                    <option value="pt">🇧🇷 Portuguese</option>
                    <option value="ja">🇯🇵 Japanese</option>
                    <option value="ko">🇰🇷 Korean</option>
                    <option value="zh">🇨🇳 Chinese</option>
                </select>
            </div>
            <button id="speakBtn" onclick="speak()">🎙️ Hablar</button>
            <div id="status" class="status"></div>
            
            <div class="player" id="playerSection" style="display:none;">
                <audio id="audioPlayer" controls></audio>
            </div>
        </div>
        
        <div class="card history">
            <h3 style="margin-bottom: 15px;">📜 Historial</h3>
            <div id="history"></div>
        </div>
    </div>
    
    <script>
        let history = [];
        let audioFiles = {};
        
        async function speak() {
            const text = document.getElementById('text').value;
            const lang = document.getElementById('lang').value;
            const btn = document.getElementById('speakBtn');
            const status = document.getElementById('status');
            
            if (!text) {
                status.textContent = 'Por favor escribe algo';
                status.className = 'status error';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '⏳ Generando...';
            
            try {
                // Call TTS API
                const response = await fetch(`/tts?text=${encodeURIComponent(text)}&lang=${lang}`);
                const data = await response.json();
                
                if (data.success) {
                    // Play audio
                    const audio = document.getElementById('audioPlayer');
                    audio.src = data.audio_url;
                    audio.play();
                    
                    document.getElementById('playerSection').style.display = 'block';
                    
                    status.textContent = `✅ Audio generado: ${data.lang_name}`;
                    status.className = 'status success';
                    
                    // Add to history
                    history.unshift({ text, lang: data.lang_name, url: data.audio_url });
                    updateHistory();
                } else {
                    status.textContent = `❌ Error: ${data.error}`;
                    status.className = 'status error';
                }
            } catch (error) {
                status.textContent = `❌ Error de conexión: ${error.message}`;
                status.className = 'status error';
            }
            
            btn.disabled = false;
            btn.textContent = '🎙️ Hablar';
        }
        
        function getLangName(code) {
            const langs = {
                'es': 'Spanish', 'en': 'English', 'fr': 'French',
                'de': 'German', 'it': 'Italian', 'pt': 'Portuguese',
                'ja': 'Japanese', 'ko': 'Korean', 'zh': 'Chinese'
            };
            return langs[code] || code;
        }
        
        function updateHistory() {
            const container = document.getElementById('history');
            container.innerHTML = history.map((item, i) => `
                <div class="history-item" onclick="playHistory(${i})">
                    <div class="text">${item.text.substring(0, 100)}...</div>
                    <div class="meta">${item.lang}</div>
                </div>
            `).join('');
        }
        
        function playHistory(index) {
            const audio = document.getElementById('audioPlayer');
            audio.src = history[index].url;
            audio.play();
            document.getElementById('playerSection').style.display = 'block';
        }
        
        // Enter key to speak
        document.getElementById('text').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                speak();
            }
        });
    </script>
</body>
</html>
